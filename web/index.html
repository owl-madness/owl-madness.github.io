<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0C1220">

  <title>Sourav Sathyan CP | Flutter Developer</title>
  <meta name="description" content="Flutter developer with 4+ years of experience shipping Android and iOS apps: real-time messaging, push notifications, native integrations and store releases.">
  <meta name="author" content="Sourav Sathyan CP">

  <!-- Link preview (LinkedIn, WhatsApp). After you deploy, replace
       YOUR-SITE-URL with the real address and add a 1200x630 image
       named preview.png in this folder. LinkedIn needs absolute URLs. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sourav Sathyan CP | Flutter Developer">
  <meta property="og:description" content="Flutter developer with 4+ years of experience shipping Android and iOS apps.">
  <meta property="og:url" content="https://YOUR-SITE-URL/">
  <meta property="og:image" content="https://YOUR-SITE-URL/preview.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0C1220; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: #0C1220; color: #E9EEF7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #splash .name { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    #splash .bar { width: 120px; height: 3px; background: #243049; overflow: hidden; border-radius: 2px; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #54C5F8;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Loading">
    <div class="name">Sourav Sathyan CP</div>
    <div class="bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
